# Show Control Hub behind Apache (cPanel / EasyApache 4).
# install-hub.sh copies this to /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/<domain>/showcontrol-hub.conf
# so it lives inside cPanel's own HTTPS virtual host for the subdomain (and survives cPanel updates).
# Needs mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_rewrite and mod_headers.

ProxyRequests Off
ProxyPreserveHost On
# Phones and PCs keep their WebSockets open for hours; the hub pings every 20-25 s.
ProxyTimeout 3600
RequestHeader set X-Forwarded-Proto "https"

# cPanel's AutoSSL validates the certificate through these paths: keep them on Apache.
ProxyPass /.well-known/ !

# WebSockets: PCs (/agent) and phones (/ws/agent/...)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^/(.*)$ ws://127.0.0.1:__PORT__/$1 [P,L]

# Everything else: the admin page and the REST API
ProxyPass / http://127.0.0.1:__PORT__/
ProxyPassReverse / http://127.0.0.1:__PORT__/
