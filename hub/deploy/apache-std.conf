# Plain HTTP for the hub's subdomain: send everyone to HTTPS (except certificate validation).
# install-hub.sh copies this to /etc/apache2/conf.d/userdata/std/2_4/<cpanel-user>/<domain>/showcontrol-hub.conf
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
